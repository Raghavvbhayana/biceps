name: Deploy Infrastructure to Prod

on:
  pull_request:
    branches:
      - testing

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  RESOURCE_GROUP: RnD-RaghavRG # Fixed spelling to match your .bicepparam

jobs:
  deploy-prod:
    name: Deploy Resources to Prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install latest Bicep
        run: az bicep upgrade

      # Pre-deployment validation (Optional but safer)
      - name: Run What-If
        run: |
          az deployment group what-if \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file main.bicep \
            --parameters param.bicepparam
